services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: featuredb
      POSTGRES_USER: featureapp
      POSTGRES_PASSWORD: featureapp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U featureapp -d featuredb"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://featureapp:featureapp@db:5432/featuredb
      CORS_ORIGINS: "*"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
